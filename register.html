<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Dream Travel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom Style System -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
    <!-- Dark Mode Initializer -->
    <script src="js/darkmode.js"></script>
</head>
<body class="page-fade-transition">

    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="spinner-glass mb-3"></div>
        <h4 class="font-weight-bold" style="color: var(--primary-accent);">Dream Travel</h4>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand-custom" href="index.html">
                <i class="fa-solid fa-plane-departure"></i>
                <span>Dream Travel</span>
            </a>
            <button class="navbar-toggler navbar-toggler-custom" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto">
                    <li class="nav-item"><a class="nav-link-custom" href="index.html" data-i18n="nav.home">Home</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="destinations.html" data-i18n="nav.destinations">Destinations</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="packages.html" data-i18n="nav.packages">Packages</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="hotels.html" data-i18n="nav.hotels">Hotels</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="index.html#ai-planner-section" data-i18n="nav.aiplanner">AI Planner</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="gallery.html" data-i18n="nav.gallery">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="about.html" data-i18n="nav.about">About</a></li>
                    <li class="nav-item"><a class="nav-link-custom" href="contact.html" data-i18n="nav.contact">Contact</a></li>
                </ul>
                <div class="navbar-controls">
                    <button class="btn-control" id="theme-toggle-btn" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
                    <button class="btn-control language-selector font-weight-bold" id="currency-toggle-btn" title="Toggle Currency"><i class="fa-solid fa-dollar-sign"></i> USD</button>
                    <div class="dropdown">
                        <button class="btn-control language-selector dropdown-toggle" type="button" id="langDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <img src="https://flagcdn.com/16x12/us.png" id="selected-lang-flag" alt="Flag">
                            <span id="selected-lang-text">English</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end bg-glass border-glass rounded-3" aria-labelledby="langDropdown">
                            <li><a class="dropdown-item d-flex align-items-center gap-2 lang-option" href="#" data-lang="en"><img src="https://flagcdn.com/16x12/us.png" alt="US"> English</a></li>
                            <li><a class="dropdown-item d-flex align-items-center gap-2 lang-option" href="#" data-lang="vi"><img src="https://flagcdn.com/16x12/vn.png" alt="VN"> Tiếng Việt</a></li>
                        </ul>
                    </div>
                    <div id="navbar-auth-container">
                        <a href="login.html" class="btn-premium" data-i18n="nav.login">Login</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Auth Container -->
    <div class="auth-page">
        <!-- Floating icons -->
        <i class="fa-solid fa-compass floating-icon float-item-1" style="font-size: 2.8rem; top: 12%; left: 8%;"></i>
        <i class="fa-solid fa-map floating-icon float-item-2" style="font-size: 2.2rem; bottom: 25%; right: 10%;"></i>
        <i class="fa-solid fa-passport floating-icon float-item-1" style="font-size: 2.5rem; top: 30%; right: 18%;"></i>
        <i class="fa-solid fa-suitcase floating-icon float-item-2" style="font-size: 2.4rem; bottom: 12%; left: 12%;"></i>

        <div class="glass-card auth-card text-center glass-shine">
            <h2 class="font-weight-bold mb-2" data-i18n="auth.signup">Sign Up</h2>
            <p class="text-muted mb-4" data-i18n="hero.subtitle">Join the premium community of travelers and AI planners.</p>
            
            <form id="register-form">
                <div class="text-start mb-3">
                    <label class="form-label text-muted small" data-i18n="contact.name">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border: 1px solid var(--input-border); border-radius: 12px 0 0 12px;"><i class="fa-regular fa-user"></i></span>
                        <input type="text" class="form-control glass-input border-start-0" id="reg-name" style="border-radius: 0 12px 12px 0;" placeholder="Tran Dang Gia Nghia" required>
                    </div>
                </div>

                <div class="text-start mb-3">
                    <label class="form-label text-muted small" data-i18n="contact.email">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border: 1px solid var(--input-border); border-radius: 12px 0 0 12px;"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" class="form-control glass-input border-start-0" id="reg-email" style="border-radius: 0 12px 12px 0;" placeholder="example@gmail.com" required>
                    </div>
                </div>
                
                <div class="text-start mb-3">
                    <label class="form-label text-muted small" data-i18n="auth.signin">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border: 1px solid var(--input-border); border-radius: 12px 0 0 12px;"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control glass-input border-start-0 border-end-0" id="reg-password" style="border-radius: 0;" placeholder="••••••" required>
                        <button type="button" class="btn btn-outline-secondary border-start-0 text-muted" id="toggle-password" style="border: 1px solid var(--input-border); border-radius: 0 12px 12px 0; background: var(--input-bg);"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <div class="text-start mb-4">
                    <label class="form-label text-muted small" data-i18n="auth.confirm">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-end-0 text-muted" style="border: 1px solid var(--input-border); border-radius: 12px 0 0 12px;"><i class="fa-solid fa-lock-open"></i></span>
                        <input type="password" class="form-control glass-input border-start-0 border-end-0" id="reg-password-confirm" style="border-radius: 0;" placeholder="••••••" required>
                        <button type="button" class="btn btn-outline-secondary border-start-0 text-muted" id="toggle-password-confirm" style="border: 1px solid var(--input-border); border-radius: 0 12px 12px 0; background: var(--input-bg);"><i class="fa-solid fa-eye"></i></button>
                    </div>
                </div>

                <div class="form-check text-start mb-4">
                    <input class="form-check-input" type="checkbox" id="terms-agree" required>
                    <label class="form-check-label text-muted small" for="terms-agree">
                        I agree to the <a href="#" class="text-teal text-decoration-none font-weight-bold" data-i18n="footer.terms">Terms & Conditions</a>
                    </label>
                </div>

                <button type="submit" class="btn-premium w-100 py-3 mb-3 justify-content-center" data-i18n="auth.signup">Sign Up</button>
            </form>

            <div class="text-center text-muted small mt-3">
                <span data-i18n="auth.hasaccount">Already have an account?</span> 
                <a href="login.html" class="text-teal text-decoration-none font-weight-bold" data-i18n="auth.signin">Sign In</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core Scripts -->
    <script src="js/data.js"></script>
    <script src="js/language.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.lang-option').forEach(option => {
                option.addEventListener('click', (e) => {
                    e.preventDefault();
                    LanguageEngine.setLanguage(option.dataset.lang);
                });
            });
        });
    </script>
</body>
</html>
